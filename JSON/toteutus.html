
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitekniikat</title>
</head>
<body>
    
<nav>
    <a href="index.html">Etusivu</a> |
    <a href="haku.html">Tehtävä 1</a> |
    <a href="poke.html">Pokémon-haku</a> |
    <a href="eevee.html">Eevee</a> |
    <a href="saa.html">Sää</a> |
    <a href="toteutus.html">Toteutus</a>
</nav>
<hr>
    <div id="vastaus">Haetaan tietoja...</div>

    <script>
        // Haetaan tiedot JSON-tiedostosta.
        fetch("./toteutus.JSON")
            .then(function (response) {
                return response.json();
            })
            .then(function (obj) {
                let tiedot = "<h2>" + obj.nimi + "</h2>";

                tiedot += "<p>" + obj.osallistujien_lukumaara +
                    " kpl</p>";

                // Näytetään osallistujien nimet vierekkäin.
                tiedot += "<p>";
                for (let i = 0; i < obj.osallistujat.length; i++) {
                    tiedot += obj.osallistujat[i];
                    if (i < obj.osallistujat.length - 1) {
                        tiedot += ", ";
                    }
                }
                tiedot += "</p>";

                tiedot += "<p>" + obj.alkamisaika + " – " +
                    obj.loppumisaika + "</p>";
                tiedot += "<p>" + obj.kesto_viikkoina +
                    " viikkoa</p>";

                // Näytetään toteutuksen kuva.
                tiedot += "<img src='" + obj.kuva +
                    "' alt='Digitekniikat' width='300'>";

                document.getElementById("vastaus").innerHTML = tiedot;
            })
            .catch(function () {
                document.getElementById("vastaus").innerHTML =
                    "Tietojen hakeminen epäonnistui.";
            });
    </script>
</body>
</html>
