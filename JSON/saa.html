<main class="container py-3">
    <h1>Helsingin sää</h1>

    <p id="latausaika"></p>
    <div id="vastaus">Haetaan säätietoja...</div>
</main>

<script>
    // Tallennetaan aika, jolloin sivu ladattiin.
    const latausaika = new Date();

    document.getElementById("latausaika").innerHTML =
        "<strong>Sää </strong> " +
        latausaika.toLocaleString("fi-FI");

    // Haetaan Helsingin säätiedot OpenWeather-palvelusta.
    const URL = "https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric";

    fetch(URL)
        .then(function(response) {
            if (!response.ok) {
                throw new Error("Säätietojen hakeminen epäonnistui.");
            }
            return response.json();
        })
        .then(function(data) {
            let tiedot = "<h2>" + data.name + "</h2>";

            tiedot += "<p><strong>Sää:</strong> " +
                data.weather[0].description + "</p>";

            tiedot += "<p><strong>Lämpötila:</strong> " +
                data.main.temp + " °C</p>";

            tiedot += "<p><strong>Tuuli:</strong> " +
                data.wind.speed + " m/s</p>";

            tiedot += "<img class='img-fluid' src='https://openweathermap.org/img/wn/" +
                data.weather[0].icon + "@2x.png' alt='Sääkuvake'>";

            document.getElementById("vastaus").innerHTML = tiedot;
        })
        .catch(function(error) {
            document.getElementById("vastaus").innerHTML =
                "<p>Säätietojen haku epäonnistui. Tarkista yhteys tai API-avain.</p>";
            console.error(error);
        });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
