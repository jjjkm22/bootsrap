    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#valikko"
                aria-controls="valikko" aria-expanded="false"
                aria-label="Avaa navigaatio">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="valikko">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Tehtävä 1 OSA I</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA II</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="poke.html">Poke haku (Tehtävä 2 OSA I)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="eevee.html">Tehtävä 2 OSA II</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="saa.html">Tehtävä 3</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-3">
    <h1>Pokemon haku</h1>

    <p>Kirjoita laatikkoon Pokemonin nimi.</p>

    <div class="mb-3">
        <input class="form-control mb-2" type="text"
               id="pokemonName" placeholder="Esim. eevee">
        <button class="btn btn-success" onclick="poke()">Hae</button>
    </div>

    <p>Jos et muista Pokemoneja ulkoa, tässä joitakin esimerkkejä:</p>

    <ul>
        <li>mew</li>
        <li>eevee</li>
        <li>bulbasaur</li>
        <li>ivysaur</li>
        <li>venusaur</li>
    </ul>

    <div id="nimi" class="mt-3"></div>
    <div id="kuva2" class="my-3"></div>
</main>

<script>
function poke() {
    const pokeName = document.getElementById("pokemonName").value
        .toLowerCase().trim();

    document.getElementById("nimi").innerHTML = "";
    document.getElementById("kuva2").innerHTML = "";

    if (pokeName === "") {
        document.getElementById("nimi").innerHTML =
            "<p>Kirjoita ensin Pokemonin nimi.</p>";
        return;
    }

    document.getElementById("nimi").innerHTML = "<p>Haetaan...</p>";

    fetch("https://pokeapi.co/api/v2/pokemon/" +
        encodeURIComponent(pokeName))
        .then(function(response) {
            if (!response.ok) {
                throw new Error("Pokemonia ei löytynyt. Tarkista nimi.");
            }
            return response.json();
        })
        .then(function(data) {
            pokekuva(data);

            // Tyhjennetään hakukenttä onnistuneen haun jälkeen.
            document.getElementById("pokemonName").value = "";
        })
        .catch(function(error) {
            document.getElementById("nimi").innerHTML =
                "<p>" + error.message + "</p>";
            document.getElementById("kuva2").innerHTML = "";
        });
}

function pokekuva(obj) {
    document.getElementById("nimi").innerHTML =
        "<h2>" + obj.name + "</h2>";

    const kuva = obj.sprites.front_default;

    if (kuva) {
        document.getElementById("kuva2").innerHTML =
            "<img class='img-fluid' src='" + kuva +
            "' alt='" + obj.name + "' width='200'>";
    } else {
        document.getElementById("kuva2").innerHTML =
            "<p>Pokemonista ei löytynyt kuvaa.</p>";
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
