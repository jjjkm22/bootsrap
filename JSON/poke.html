```html
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke haku - Tehtävä 2 OSA I</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">JSON-tehtävät</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#valikko"
                    aria-controls="valikko" aria-expanded="false"
                    aria-label="Avaa navigaatio">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA I)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA II</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="poke.html">Poke haku (Tehtävä 2 OSA I)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="eevee.html">Tehtävä 2 OSA II</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saa.html">Tehtävä 3</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-3">
        <h1>Poke haku</h1>

        <p>Kirjoita englanninkielinen Pokemonin nimi hakukenttään.</p>

        <div class="mb-3">
            <input class="form-control mb-2" type="text"
                   id="pokemonName" placeholder="Esim. eevee">
            <button class="btn btn-success" onclick="poke()">Hae</button>
        </div>

        <div id="nimi">Kirjoita laatikkoon Pokemonin nimi</div>
        <div id="kuva2" class="my-3"></div>

        <div id="kaantoalue" class="mb-3" hidden>
            <button class="btn btn-success" onclick="kaanna()">Käännä</button>
        </div>

        <div id="ominaisuudet"></div>
    </main>

    <script>
        let name = "";
        let pokemon = null;
        let kaannetty = false;

        function poke() {
            const pokeName = document.getElementById("pokemonName")
                .value.toLowerCase().trim();

            if (pokeName === "") {
                document.getElementById("nimi").innerHTML =
                    "Kirjoita ensin Pokemonin nimi.";
                document.getElementById("kuva2").innerHTML = "";
                document.getElementById("kaantoalue").hidden = true;
                document.getElementById("ominaisuudet").innerHTML = "";
                pokemon = null;
                return;
            }

            name = pokeName;
            pokemon = null;
            document.getElementById("nimi").innerHTML = "Haetaan...";
            document.getElementById("kuva2").innerHTML = "";
            document.getElementById("kaantoalue").hidden = true;
            document.getElementById("ominaisuudet").innerHTML = "";

            fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Pokemonia ei löytynyt.");
                    }
                    return response.json();
                })
                .then(function (responseJson) {
                    pokekuva(responseJson);
                })
                .catch(function () {
                    document.getElementById("nimi").innerHTML =
                        "Tietoa ei pystytä hakemaan. Tarkista nimi.";
                    document.getElementById("kuva2").innerHTML = "";
                    document.getElementById("kaantoalue").hidden = true;
                    document.getElementById("ominaisuudet").innerHTML = "";
                    pokemon = null;
                });
        }

        function pokekuva(obj) {
            pokemon = obj;
            kaannetty = false;

            const pokeurl = obj.sprites.front_default;

            document.getElementById("nimi").innerHTML =
                "<h2>" + obj.name + "</h2>";

            if (pokeurl) {
                document.getElementById("kuva2").innerHTML =
                    "<img class='img-fluid' src='" + pokeurl +
                    "' alt='" + obj.name + "' width='200'>";
            } else {
                document.getElementById("kuva2").innerHTML =
                    "Pokemonista ei löytynyt kuvaa.";
            }

            document.getElementById("kaantoalue").hidden = false;
            document.getElementById("pokemonName").value = "";
            document.getElementById("ominaisuudet").innerHTML = "";
        }

        function kaanna() {
            if (!pokemon) {
                return;
            }

            kaannetty = !kaannetty;

            const pokeurl = kaannetty
                ? pokemon.sprites.back_default
                : pokemon.sprites.front_default;

            if (pokeurl) {
                document.getElementById("kuva2").innerHTML =
                    "<img class='img-fluid' src='" + pokeurl +
                    "' alt='" + pokemon.name + "' width='200'>";
            } else {
                document.getElementById("kuva2").innerHTML =
                    "Pokemonista ei löytynyt tätä kuvakulmaa.";
            }

            if (kaannetty) {
                document.getElementById("ominaisuudet").innerHTML =
                    "<h3>Pokemonin ominaisuudet</h3>" +
                    "<p><b>Korkeus:</b> " + pokemon.height / 10 +
                    " m</p>" +
                    "<p><b>Paino:</b> " + pokemon.weight / 10 +
                    " kg</p>" +
                    "<p><b>Kokemus:</b> " +
                    (pokemon.base_experience ?? "Ei saatavilla") + "</p>";
            } else {
                document.getElementById("ominaisuudet").innerHTML = "";
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
