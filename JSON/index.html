<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">

                    data-bs-toggle="collapse" data-bs-target="#valikko"

                    aria-label="Avaa navigaatio">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-3">
        <div id="vastaus">Haetaan tietoja...</div>
    </main>

    <script>
        fetch("./tietue.JSON")
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("JSON-tiedostoa ei löytynyt.");
                }
                return response.json();
            })
            .then(function (obj) {
                let tiedot = "<h1>" + obj.otsikko + "</h1>";
                tiedot += "<p>" + obj.kuvaus + "</p>";

                tiedot += "<p><img class='img-fluid rounded' src='" +
                    obj.kuva +
                    "' alt='Opintojakson kuva' style='max-width: 300px;'></p>";

                tiedot += "<h2>Opintojakso</h2>";
                tiedot += "<p><strong>Nimi:</strong> " +
                    obj.opintojakso.nimi + "<br>";
                tiedot += "<strong>Tunnus:</strong> " +
                    obj.opintojakso.tunnus + "<br>";
                tiedot += "<strong>Opintopisteet:</strong> " +
                    obj.opintojakso.opintopisteet + "</p>";

                tiedot += "<h2>Aiheet</h2>";

                for (let i = 0; i < obj.tekniikat.length; i++) {
                    tiedot += "<p><strong>Aihe:</strong> " +
                        obj.tekniikat[i].aihe + "<br>";
                    tiedot += "<a href='" +
                        obj.tekniikat[i].linkki +
                        "' target='_blank' rel='noopener noreferrer'>" +
                        obj.tekniikat[i].linkki + "</a></p>";
                }

                document.getElementById("vastaus").innerHTML = tiedot;
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Tietojen hakeminen epäonnistui. Tarkista tietue.JSON-tiedosto.</p>";
                console.error(error);
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
