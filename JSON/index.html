<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-datan käsittelyä</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#valikko"
                aria-controls="valikko" aria-expanded="false"
                aria-label="Avaa navigaatio">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="valikko">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Tehtävä 1 OSA I</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA II</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="poke.html">Poke haku (Tehtävä 2 OSA I)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="eevee.html">Tehtävä 2 OSA II</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="saa.html">Tehtävä 3</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-3">
    <div id="vastaus">Haetaan tietoja...</div>
</main>

<script>
fetch("./tietue.JSON")
    .then(function(response) {
        if (!response.ok) {
            throw new Error("JSON-tiedostoa ei löytynyt.");
        }
        return response.json();
    })
    .then(function(obj) {
        let tiedot = "<h1>JSON-datan käsittelyä</h1>";
        tiedot += "<p>Tällä sivustolle haetaan JSON-muotoista dataa</p>";
        tiedot += "<hr>";

        tiedot += "<p><img class='img-fluid rounded' " +
            "src='https://jaakkola.github.io/json/digi.JPG' " +
            "alt='Digitekniikat-opintojakson kuva' " +
            "style='max-width: 500px;'></p>";

        tiedot += "<h2>Opintojakso</h2>";
        tiedot += "<p>Nimi: " + obj.opintojakso.nimi + "<br>";
        tiedot += "Tunnus: " + obj.opintojakso.tunnus + "<br>";
        tiedot += "Opintopisteet: " +
            obj.opintojakso.opintopisteet + "</p>";

        tiedot += "<h2>Aiheet</h2>";

        for (let i = 0; i < obj.tekniikat.length; i++) {
            tiedot += "<p><strong>Aihe: " +
                obj.tekniikat[i].aihe + "</strong> ";
            tiedot += "<a href='" + obj.tekniikat[i].linkki +
                "' target='_blank' rel='noopener noreferrer'>" +
                obj.tekniikat[i].linkki + "</a></p>";
        }

        document.getElementById("vastaus").innerHTML = tiedot;
    })
    .catch(function(error) {
        document.getElementById("vastaus").innerHTML =
            "<p>Tietojen haku epäonnistui: " +
            error.message + "</p>";
        console.error(error);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
