<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#valikko"
                    aria-controls="valikko" aria-expanded="false"
                    aria-label="Avaa navigaatio">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">

    <main class="container py-3">
        <h1>JSON-tiedon haku</h1>

        <div id="vastaus">Haetaan tietoja...</div>
    </main>

    <script>
        fetch("./tietue.JSON")
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("JSON-tiedostoa ei löytynyt.");
                }
                return response.json();
            })
            .then(function (obj) {
                kerro(obj);
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Virhe tietojen haussa: " +
                    error.message + "</p>";
                console.error(error);
            });

        function kerro(obj) {
            let tiedot = "<h2>" + obj.otsikko + "</h2>" +
                "<p>" + obj.kuvaus + "</p><hr>";

            tiedot += "<p><img class='img-fluid rounded' src='" +
                obj.kuva +
                "' alt='Opintojakson kuva' style='max-width: 300px;'></p>";

            tiedot += "<h3>Opintojakso</h3>" +
                "<p><strong>Nimi:</strong> " + obj.opintojakso.nimi + "<br>" +
                "<strong>Tunnus:</strong> " + obj.opintojakso.tunnus + "<br>" +
                "<strong>Opintopisteet:</strong> " +
                obj.opintojakso.opintopisteet + "</p>";

            tiedot += "<h3>Aiheet</h3>";

            for (let i = 0; i < obj.tekniikat.length; i++) {
                tiedot += "<p>";
                tiedot += "<strong>Aihe:</strong> " +
                    obj.tekniikat[i].aihe + "<br>";
                tiedot += "<a href='" + obj.tekniikat[i].linkki +
                    "'>" + obj.tekniikat[i].linkki + "</a>";
                tiedot += "</p>";
            }

            document.getElementById("vastaus").innerHTML = tiedot;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
