
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-tiedon haku</title>
</head>
<body>
    <h1>JSON-tiedon haku</h1>
    <div id="vastaus">Haetaan tietoja...</div>

    <script>
        // Haetaan JSON-tietue samasta kansiosta.
        fetch("./tietue.JSON")
            .then(function (response) {
                // Tarkistetaan, löytyikö tiedosto.
                if (!response.ok) {
                    throw new Error("JSON-tiedostoa ei löytynyt.");
                }
                return response.json();
            })
            .then(function (obj) {
                // Näytetään haetut tiedot.
                kerro(obj);
            })
            .catch(function (error) {
                // Näytetään virhe sivulla ja konsolissa.
                document.getElementById("vastaus").innerHTML =
                    "<p>Virhe tietojen haussa: " +
                    error.message + "</p>";
                console.error(error);
            });

        // Muodostetaan sivulle tulostettava sisältö.
        function kerro(obj) {
            let tiedot = "<h2>" + obj.otsikko + "</h2>" +
                "<p>" + obj.kuvaus + "</p><hr>";

            tiedot += "<p><img src='" + obj.ku +
                "' alt='Opintojakson kuva' width='300'></p>";

            tiedot += "<h3>Opintojakso</h3>" +
                "Nimi: " + obj.opintojakso.nimi + "<br>" +
                "Tunnus: " + obj.opintojakso.tunnus + "<br>" +
                "Opintopisteet: " +
                obj.opintojakso.opintopisteet + "<br>";

            tiedot += "<h3>Aiheet</h3><ul>";

            obj.sisalto.forEach(function (aihe) {
                tiedot += "<li>" + aihe + "</li>";
            });

            tiedot += "</ul>";

            document.getElementById("vastaus").innerHTML = tiedot;
        }
    </script>
</body>
</html>
