
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-tiedon haku</title>
</head>
<body>
    <h1>JSON-tiedon haku</h1>

    <!-- Tähän tulostetaan haetut tiedot -->
    <div id="vastaus"></div>

    <script>
        // Haetaan oma JSON-tietue GitHub Pagesista.
        fetch("tietue.JSON")
            // Muutetaan vastaus JavaScript-olioksi.
            .then(function (response) {
                return response.json();
            })
            // Välitetään JSON-tieto kerro-funktiolle.
            .then(function (responseJson) {
                kerro(responseJson);
            })
            // Näytetään virheilmoitus, jos haku epäonnistuu.
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Tietoa ei pystytä hakemaan.</p>";
            });

        // Käsitellään haettu tieto ja näytetään se sivulla.
       
function kerro(obj) {
    // Haetaan otsikko ja kurssin kuvaus.
    let tiedot = "<h1>" + obj.otsikko + "</h1><br>" +
        obj.kuvaus + "<br><hr>";

    // Lisätään kuva.
    tiedot += "<p><img src='" + obj.kuva +
        "' alt='Opintojakson kuva' width='300'></p>";

    // Lisätään opintojakson tiedot.
    tiedot += "<h3>Opintojakso</h3>" +
        "Nimi: " + obj.opintojakso.nimi + "<br>" +
        "Tunnus: " + obj.opintojakso.tunnus + "<br>" +
        "Opintopisteet: " + obj.opintojakso.opintopisteet + "<br>";

    // Lisätään aiheiden otsikko.
    tiedot += "<h3>Aiheet</h3>";

    // Näytetään aiheet listana.
    tiedot += "<ul>";
    obj.sisalto.forEach(function (aihe) {
        tiedot += "<li>" + aihe + "</li>";
    });
    tiedot += "</ul>";

    // Tulostetaan valmis sisältö sivulle.
    document.getElementById("vastaus").innerHTML = tiedot;
}
